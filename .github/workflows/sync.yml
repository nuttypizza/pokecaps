name: Sync card data

on:
  schedule:
    # Daily at 09:00 UTC. Sundays re-fetch every set to catch silent data fixes.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Re-fetch every set"
        type: boolean
        default: false

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL secret is not set; skipping sync."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.config.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.config.outputs.skip != 'true'
      - run: npm run db:migrate
        if: steps.config.outputs.skip != 'true'
      - name: Sync
        if: steps.config.outputs.skip != 'true'
        run: |
          if [ "${{ inputs.full }}" = "true" ] || [ "$(date -u +%u)" = "7" ]; then
            npm run sync -- --full
          else
            npm run sync
          fi
      - name: Tag capabilities
        if: steps.config.outputs.skip != 'true'
        run: npm run analyze
